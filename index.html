<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>3D Thesis Book - Interactive Flipbook Reader Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #090a0f;
            color: #ffffff;
            touch-action: manipulation; 
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 16, 21, 0.75);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            text-align: center;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 6, 9, 0.94);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(18px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #090a0f 85%);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(12, 14, 20, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            z-index: 50;
            height: 52px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .modal-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 12px #6366f1;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
            transform: rotate(90deg);
        }

        .modal-body {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0;
            z-index: 2;
            touch-action: none;
        }

        #loading {
            position: absolute;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            z-index: 10;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            background: rgba(15, 16, 21, 0.6);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        .zoom-viewport {
            transition: transform 0.1s linear;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.85));
            touch-action: none;
        }

        .flipbook-wrapper {
            background: transparent;
            border-radius: 4px;
        }

        .page {
            background-color: #fcfbf9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page.--left::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 45px;
            height: 100%;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .page.--right::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 45px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.08);
            pointer-events: none;
            z-index: 4;
        }

        .page-number-printed {
            position: absolute;
            bottom: 14px;
            font-family: 'Georgia', 'Garamond', 'Times New Roman', serif;
            font-size: 13px;
            font-weight: 500;
            color: #333333; 
            z-index: 10;
            pointer-events: none;
            user-select: none;
            letter-spacing: 0.5px;
        }

        .page.--left .page-number-printed { left: 20px; }
        .page.--right .page-number-printed { right: 20px; }

        canvas.page-canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .controls {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 16, 21, 0.9);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 100;
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover { 
            background: #6366f1; 
            color: #ffffff;
            border-color: #6366f1;
        }

        .btn-zoom {
            background: transparent;
            border: none;
            padding: 6px 8px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 2px 8px;
        }

        .search-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 12px;
            outline: none;
            width: 110px;
            padding: 4px;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-btn {
            background: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .search-btn:hover {
            background: #4f46e5;
        }

        .search-results-dropdown {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 260px;
            max-height: 220px;
            background: rgba(15, 16, 21, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(16px);
            overflow-y: auto;
            display: none;
            z-index: 200;
            padding: 6px;
        }

        .search-results-dropdown.active {
            display: block;
        }

        .search-result-item {
            padding: 8px 12px;
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-result-item:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #ffffff;
        }

        .search-result-item span {
            background: #6366f1;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .page-control-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #94a3b8;
        }

        .page-input {
            width: 38px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-align: center;
            border-radius: 6px;
            padding: 3px 0;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }

        .page-input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.18);
        }

        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.18);
            margin: 0 4px;
        }
        
        .external-reader-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(99, 102, 241, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(10px);
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        .external-reader-btn:hover {
            background: #4f46e5;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <div class="instructions">Click/Tap and drag to rotate • Tap book to read</div>
    <div id="canvas-container"></div>
    <a href="reader.html" class="external-reader-btn">Buksan sa Hiwalay na Link ↗</a>

    <div class="modal-overlay" id="pdf-modal">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-title">The Contemporary World</span>
                <div class="header-actions">
                    <button class="btn" id="fullscreen-btn">⛶ Fullscreen</button>
                    <button class="close-btn" id="close-modal">&times;</button>
                </div>
            </div>
            
            <div class="modal-body" id="modal-body">
                <div id="loading">Preparing book pages...</div>
                
                <div class="zoom-viewport" id="zoom-viewport">
                    <div id="book" class="flipbook-wrapper" style="display:none;"></div>
                </div>

                <div class="controls" id="controls" style="display: none;">
                    <button class="btn" id="prev-btn">‹ Prev</button>
                    
                    <div class="page-control-group">
                        <input type="text" id="page-input" class="page-input" value="1" />
                        <span id="page-total">/ 0</span>
                    </div>

                    <button class="btn" id="next-btn">Next ›</button>
                    
                    <div class="divider"></div>

                    <div class="search-wrapper">
                        <div class="search-container">
                            <input type="text" id="search-input" class="search-input" placeholder="Search word..." />
                            <button class="search-btn" id="search-btn">Find</button>
                        </div>
                        <div class="search-results-dropdown" id="search-results"></div>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <button class="btn btn-zoom" id="zoom-out">− Zoom</button>
                    <span id="zoom-val" style="font-size: 12px; color: #f1f5f9; min-width:36px; text-align: center;">100%</span>
                    <button class="btn btn-zoom" id="zoom-in">+ Zoom</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function createPaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f2efe9'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#d4ceb8';
            for (let i = 0; i < 256; i += 3) { ctx.fillRect(0, i, 256, 1); }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 4);
            return texture;
        }

        function createCoverWithCrease(imagePath, isBackCover = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            const img = new Image(); img.crossOrigin = "Anonymous"; img.src = imagePath;
            img.onload = () => {
                canvas.width = img.width || 1024; canvas.height = img.height || 1400;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const creaseX = isBackCover ? canvas.width * 0.92 : canvas.width * 0.08; 
                const grooveWidth = canvas.width * 0.035;
                const darkGradient = ctx.createLinearGradient(creaseX - grooveWidth, 0, creaseX + grooveWidth, 0);
                darkGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                darkGradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.5)');
                darkGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = darkGradient;
                ctx.fillRect(creaseX - grooveWidth, 0, grooveWidth * 2, canvas.height);
                texture.needsUpdate = true;
            };
            return texture;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraPosition() {
            if (window.innerWidth < 600) {
                camera.position.set(0, 1.0, 7.5);
            } else {
                camera.position.set(0, 1.2, 5.5);
            }
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(4, 8, 5); dirLight.castShadow = true;
        scene.add(dirLight);

        const starsCount = 2000;
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 120;
            starPositions[i + 1] = (Math.random() - 0.5) * 120;
            starPositions[i + 2] = (Math.random() - 0.5) * 120;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 }));
        scene.add(starField);

        const textureLoader = new THREE.TextureLoader();
        const frontCover = createCoverWithCrease('front-cover.jpg', false);
        const backCover = createCoverWithCrease('back-cover.jpg', true);
        const spineCover = textureLoader.load('spine-cover.jpg');
        const paperMaterial = new THREE.MeshStandardMaterial({ map: createPaperTexture(), roughness: 0.8 });

        const materials = [
            paperMaterial,
            new THREE.MeshStandardMaterial({ map: spineCover, roughness: 0.4 }),
            paperMaterial, paperMaterial,
            new THREE.MeshStandardMaterial({ map: frontCover, roughness: 0.3 }),
            new THREE.MeshStandardMaterial({ map: backCover, roughness: 0.3 })
        ];

        const bookGroup = new THREE.Group();
        const book = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 0.28), materials);
        book.castShadow = true;
        bookGroup.add(book);
        bookGroup.rotation.y = Math.PI / 4;
        scene.add(bookGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(book);
            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        const pdfUrl = 'THE-CONTEMPORARY-WORLD.pdf'; 
        let pageFlip = null;
        let currentZoom = 1.0;
        let panX = 0, panY = 0;
        let totalPdfPages = 0;
        let pdfTextContent = [];

        const modal = document.getElementById('pdf-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const zoomViewport = document.getElementById('zoom-viewport');
        const zoomValSpan = document.getElementById('zoom-val');
        const pageInput = document.getElementById('page-input');
        const pageTotal = document.getElementById('page-total');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const searchResultsDropdown = document.getElementById('search-results');

        async function initFlipbook() {
            if (pageFlip) return;

            const loadingEl = document.getElementById('loading');
            const bookContainer = document.getElementById('book');
            const controlsEl = document.getElementById('controls');
            const modalBody = document.getElementById('modal-body');

            try {
                loadingEl.innerText = 'Wait for PDF file...';
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPdfPages = pdf.numPages;
                pageTotal.innerText = `/ ${totalPdfPages}`;

                const isMobile = window.innerWidth < 768;
                const availableHeight = modalBody.clientHeight - 80; 
                const targetHeight = availableHeight;

                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                const targetWidth = (originalViewport.width / originalViewport.height) * targetHeight;

                loadingEl.innerText = 'Preparing book pages & text index...';

                for (let i = 1; i <= totalPdfPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const textItems = textContent.items.map(item => item.str).join(' ');
                    pdfTextContent[i] = textItems.toLowerCase();

                    const viewport = page.getViewport({ scale: 2.0 }); 
                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = `page ${i % 2 === 0 ? '--left' : '--right'}`;
                    pageDiv.appendChild(canvas);

                    const pageNumDisplay = document.createElement('div');
                    pageNumDisplay.className = 'page-number-printed';
                    pageNumDisplay.innerText = i;
                    pageDiv.appendChild(pageNumDisplay);

                    bookContainer.appendChild(pageDiv);
                }

                pageFlip = new St.PageFlip(bookContainer, {
                    width: targetWidth,
                    height: targetHeight,
                    size: isMobile ? 'fixed' : 'stretch',
                    minWidth: 150,
                    maxWidth: 1000,
                    minHeight: 250,
                    maxHeight: 1400,
                    maxShadowOpacity: 0.85,
                    showCover: false,
                    drawShadow: true,
                    flippingTime: 300,
                    usePortrait: isMobile, 
                    mobileScrollSupport: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                pageFlip.on('flip', (e) => {
                    pageInput.value = e.data + 1;
                });

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';
                pageInput.value = 1;

            } catch (error) {
                console.error('Error loading PDF flipbook:', error);
                loadingEl.innerHTML = '⚠️ <strong>Hindi ma-load ang PDF.</strong>';
            }
        }

        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            searchResultsDropdown.innerHTML = '';
            
            if (!query) {
                searchResultsDropdown.classList.remove('active');
                return;
            }

            let matches = [];
            for (let i = 1; i <= totalPdfPages; i++) {
                if (pdfTextContent[i] && pdfTextContent[i].includes(query)) {
                    matches.push(i);
                }
            }

            if (matches.length > 0) {
                searchResultsDropdown.classList.add('active');
                matches.forEach(pageNum => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.innerHTML = `<span>Page ${pageNum}</span> Matched keyword`;
                    item.addEventListener('click', () => {
                        pageFlip.flip(pageNum - 1);
                        pageInput.value = pageNum;
                        searchResultsDropdown.classList.remove('active');
                    });
                    searchResultsDropdown.appendChild(item);
                });
            } else {
                searchResultsDropdown.classList.add('active');
                const noItem = document.createElement('div');
                noItem.className = 'search-result-item';
                noItem.style.justifyContent = 'center';
                noItem.style.color = '#94a3b8';
                noItem.innerText = `Walang nakitang "${query}"`;
                searchResultsDropdown.appendChild(noItem);
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                searchResultsDropdown.classList.remove('active');
            }
        });

        let initialDist = 0;
        let startTouchX = 0, startTouchY = 0;

        function updateTransform() {
            zoomViewport.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
            zoomValSpan.innerText = `${Math.round(currentZoom * 100)}%`;
        }

        const modalBodyEl = document.getElementById('modal-body');

        modalBodyEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            } else if (e.touches.length === 1 && currentZoom > 1.0) {
                startTouchX = e.touches[0].clientX - panX;
                startTouchY = e.touches[0].clientY - panY;
            }
        });

        modalBodyEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const factor = dist / initialDist;
                initialDist = dist;
                currentZoom = Math.min(Math.max(currentZoom * factor, 0.9), 3.0);
                if (currentZoom <= 1.0) { panX = 0; panY = 0; }
                updateTransform();
            } else if (e.touches.length === 1 && currentZoom > 1.0) {
                panX = e.touches[0].clientX - startTouchX;
                panY = e.touches[0].clientY - startTouchY;
                updateTransform();
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
        document.getElementById('next-btn').addEventListener('click', () => pageFlip && pageFlip.flipNext());

        pageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let targetPage = parseInt(pageInput.value);
                if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= totalPdfPages) {
                    pageFlip.flip(targetPage - 1);
                } else {
                    pageInput.value = (pageFlip ? pageFlip.getCurrentPageIndex() + 1 : 1);
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (document.activeElement === pageInput || document.activeElement === searchInput) return;
            if (e.key === 'ArrowRight') pageFlip && pageFlip.flipNext();
            if (e.key === 'ArrowLeft') pageFlip && pageFlip.flipPrev();
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (currentZoom < 2.5) { currentZoom += 0.2; updateTransform(); }
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (currentZoom > 0.8) { currentZoom -= 0.2; if (currentZoom <= 1.0) { panX = 0; panY = 0; } updateTransform(); }
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        let pointerStartX = 0, pointerStartY = 0;
        window.addEventListener('pointerdown', (e) => { pointerStartX = e.clientX; pointerStartY = e.clientY; });

        window.addEventListener('pointerup', (e) => {
            if (modal.classList.contains('active')) return;
            if (Math.abs(e.clientX - pointerStartX) < 12 && Math.abs(e.clientY - pointerStartY) < 12) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.intersectObject(book).length > 0) {
                    modal.classList.add('active');
                    initFlipbook();
                }
            }
        });

        function closeModal() {
            modal.classList.remove('active');
            currentZoom = 1.0; panX = 0; panY = 0;
            updateTransform();
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraPosition();
        });

        function animate() {
            requestAnimationFrame(animate);
            if (typeof starField !== 'undefined') {
                starField.rotation.y += 0.0003;
                starField.rotation.x += 0.0001;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
